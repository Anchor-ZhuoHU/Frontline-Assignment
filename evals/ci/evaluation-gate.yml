name: Frontline Evaluation Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run evaluation unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s evals/tests -v
      - name: Run credential-free offline evaluation gate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m evals run --output /tmp/frontline-evals-ci
